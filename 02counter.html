<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="index.html">Home</a><a href="00renamer.html">File Renamer</a><a href="01converter.html">WEBP ► JPG</a><a href="02counter.html">Word Counter</a>
  </div>
  <div class="sun altt"></div>
  <h1>❤︎ Word Counter ❤︎</h1>
  <p class="sub">paste or type below (counts update as you go, and the buttons rewrite the text in place)<br>❤︎</p>

  <div class="card">
    <h2>1. Your text</h2>
    <textarea id="textInput" placeholder="Type or paste text here…"></textarea>

    <div class="stats">
      <div class="stat">
        <span class="num" id="wordCount">0</span>
        <span class="label">Words</span>
      </div>
      <div class="stat">
        <span class="num" id="charNoSpaces">0</span>
        <span class="label">Characters</span>
      </div>
      <div class="stat">
        <span class="num" id="charWithSpaces">0</span>
        <span class="label">Chars + spaces</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. Change the case</h2>
    <div class="btn-row">
      <button class="small" id="btnUpper">UPPERCASE</button>
      <button class="small" id="btnLower">lowercase</button>
      <button class="small" id="btnCapitalize">Capitalize Each Word</button>
      <button class="small" id="btnSentence">Sentence case</button>
    </div>
    <div class="actions" style="margin-top:16px;">
      <button class="secondary" id="btnCopy">Copy text</button>
      <button class="secondary" id="btnClear">Clear</button>
    </div>
    <div class="summary hidden" id="copyMsg">Copied ❤</div>
  </div>
</div>

<script>
const textInput = document.getElementById('textInput');
const wordCount = document.getElementById('wordCount');
const charNoSpaces = document.getElementById('charNoSpaces');
const charWithSpaces = document.getElementById('charWithSpaces');
const copyMsg = document.getElementById('copyMsg');

function updateStats(){
  const text = textInput.value;
  const words = text.trim().length ? text.trim().split(/\s+/).length : 0;
  wordCount.textContent = words;
  charWithSpaces.textContent = text.length;
  charNoSpaces.textContent = text.replace(/\s/g, '').length;
}

textInput.addEventListener('input', updateStats);
updateStats();

document.getElementById('btnUpper').addEventListener('click', () => {
  textInput.value = textInput.value.toUpperCase();
  updateStats();
});

document.getElementById('btnLower').addEventListener('click', () => {
  textInput.value = textInput.value.toLowerCase();
  updateStats();
});

document.getElementById('btnCapitalize').addEventListener('click', () => {
  textInput.value = textInput.value
    .toLowerCase()
    .replace(/\b\w/g, c => c.toUpperCase());
  updateStats();
});

document.getElementById('btnSentence').addEventListener('click', () => {
  const lowered = textInput.value.toLowerCase();
  textInput.value = lowered.replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase());
  updateStats();
});

document.getElementById('btnClear').addEventListener('click', () => {
  textInput.value = '';
  updateStats();
  textInput.focus();
});

document.getElementById('btnCopy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(textInput.value);
    copyMsg.classList.remove('hidden');
    setTimeout(() => copyMsg.classList.add('hidden'), 1500);
  } catch (err) {
    textInput.select();
    document.execCommand('copy');
  }
});
</script>
</body>
</html>
